---
- name: Sentinel - diagnóstico operacional Windows
  hosts: windows
  gather_facts: false

  vars:
    monitored_services:
      - WinRM
      - W32Time
      - EventLog

  tasks:
    - name: Coletar saúde do host sem alterar o sistema
      ansible.windows.win_powershell:
        script: |
          $ErrorActionPreference = 'Stop'
          $os = Get-CimInstance Win32_OperatingSystem
          $services = @('{{ monitored_services | join("','") }}') | ForEach-Object {
            $service = Get-Service -Name $_ -ErrorAction SilentlyContinue
            [pscustomobject]@{
              name = $_
              status = if ($service) { [string]$service.Status } else { 'NotFound' }
            }
          }
          $disks = Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" | ForEach-Object {
            [pscustomobject]@{
              device = $_.DeviceID
              free_gb = [math]::Round($_.FreeSpace / 1GB, 2)
              size_gb = [math]::Round($_.Size / 1GB, 2)
              free_percent = if ($_.Size) {
                [math]::Round(($_.FreeSpace / $_.Size) * 100, 2)
              } else { 0 }
            }
          }
          # LoadPercentage já é a média entre os processadores lógicos — evita
          # amostragem via Get-Counter, que exige dois pontos no tempo.
          $cpuPercent = (Get-CimInstance Win32_Processor |
            Measure-Object -Property LoadPercentage -Average).Average

          # Top consumidores de CPU. O campo CPU de Get-Process é tempo
          # ACUMULADO desde o boot — num relatório de incidente ele aponta
          # quem mais rodou no dia, não quem está causando o pico agora. Por
          # isso a amostragem via contador: a primeira leitura só "aquece" o
          # contador (vem zerada) e a segunda é a que vale.
          $cores = [Environment]::ProcessorCount
          Get-Counter '\Process(*)\% Processor Time' -ErrorAction SilentlyContinue | Out-Null
          Start-Sleep -Seconds 1
          $samples = (Get-Counter '\Process(*)\% Processor Time' -ErrorAction SilentlyContinue).CounterSamples
          $topCpu = @(
            $samples |
              Where-Object { $_.InstanceName -notin @('_total', 'idle') } |
              Sort-Object CookedValue -Descending |
              Select-Object -First 10 |
              ForEach-Object {
                [pscustomobject]@{
                  name = ($_.InstanceName -replace '#\d+$', '')
                  cpu_percent = [math]::Round($_.CookedValue / $cores, 2)
                }
              }
          )

          # WorkingSet64 é a memória física em uso pelo processo — é o número
          # que mais se aproxima do que o Gerenciador de Tarefas mostra.
          $topMemory = @(
            Get-Process |
              Sort-Object WorkingSet64 -Descending |
              Select-Object -First 10 |
              ForEach-Object {
                [pscustomobject]@{
                  name = $_.Name
                  pid = $_.Id
                  memory_mb = [math]::Round($_.WorkingSet64 / 1MB, 1)
                }
              }
          )

          [pscustomobject]@{
            hostname = $env:COMPUTERNAME
            collected_at_utc = (Get-Date).ToUniversalTime().ToString('o')
            uptime_seconds = [int64]((Get-Date) - $os.LastBootUpTime).TotalSeconds
            memory_free_percent = [math]::Round(
              ($os.FreePhysicalMemory / $os.TotalVisibleMemorySize) * 100, 2
            )
            memory_total_mb = [math]::Round($os.TotalVisibleMemorySize / 1KB, 0)
            memory_free_mb = [math]::Round($os.FreePhysicalMemory / 1KB, 0)
            cpu_percent = [math]::Round($cpuPercent, 2)
            top_cpu = $topCpu
            top_memory = $topMemory
            disks = @($disks)
            services = @($services)
          } | ConvertTo-Json -Depth 5 -Compress
      register: sentinel_health
      changed_when: false

    - name: Publicar diagnóstico no resultado do job
      ansible.builtin.debug:
        msg: "{{ sentinel_health.output | default([]) | join('') }}"
      changed_when: false

    - name: Interpretar o diagnóstico coletado
      ansible.builtin.set_fact:
        sentinel_health_data: "{{ (sentinel_health.output | default([]) | join('')) | from_json }}"
      changed_when: false

    # O AWX expõe qualquer valor publicado via set_stats em job.artifacts —
    # é o contrato que o Sentinel/StackStorm
    # (sentinel_aiops.operational_health_check) lê para decidir se aciona a
    # remediação de CPU alta. "cacheable" não é aceito nesta versão do
    # ansible.builtin.set_stats (o AWX rejeita com "Invalid options"); sem
    # ele o valor ainda vai para os artifacts do job, só não persiste no
    # fact cache entre plays — irrelevante aqui, o job roda uma vez.
    - name: Publicar diagnóstico como artifacts do job (lidos pelo Sentinel)
      ansible.builtin.set_stats:
        data:
          cpu_percent: "{{ sentinel_health_data.cpu_percent | default(0) }}"
          memory_free_percent: "{{ sentinel_health_data.memory_free_percent | default(0) }}"
          memory_total_mb: "{{ sentinel_health_data.memory_total_mb | default(0) }}"
          memory_free_mb: "{{ sentinel_health_data.memory_free_mb | default(0) }}"
          # Serializados como JSON: set_stats agrega valores entre plays e o
          # comportamento com listas de dicionários não é garantido — string
          # atravessa o AWX sem ambiguidade e o Sentinel faz o parse.
          top_cpu_json: "{{ sentinel_health_data.top_cpu | default([]) | to_json }}"
          top_memory_json: "{{ sentinel_health_data.top_memory | default([]) | to_json }}"
        per_host: false
